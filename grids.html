<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen p-6">

  <!-- HEADER -->
  <header class="mb-8">
    <h1 class="text-2xl font-bold text-gray-800">Dashboard</h1>
    <p class="text-gray-500">Overview of users and gallery</p>
  </header>

  <!-- STATS GRID -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-5 mb-10">

    <div class="bg-white p-5 rounded-xl shadow hover:shadow-lg transition">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm text-gray-500">Total Users</p>
          <h2 class="text-2xl font-bold">12,450</h2>
        </div>
        <i class="fa-solid fa-users text-3xl text-blue-500"></i>
      </div>
    </div>

    <div class="bg-white p-5 rounded-xl shadow hover:shadow-lg transition">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm text-gray-500">Revenue</p>
          <h2 class="text-2xl font-bold text-green-600">₹4,80,000</h2>
        </div>
        <i class="fa-solid fa-indian-rupee-sign text-3xl text-green-500"></i>
      </div>
    </div>

    <div class="bg-white p-5 rounded-xl shadow hover:shadow-lg transition">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm text-gray-500">Orders</p>
          <h2 class="text-2xl font-bold">1,250</h2>
        </div>
        <i class="fa-solid fa-box text-3xl text-purple-500"></i>
      </div>
    </div>

    <div class="bg-white p-5 rounded-xl shadow hover:shadow-lg transition">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm text-gray-500">Others</p>
          <h2 class="text-2xl font-bold">320</h2>
        </div>
        <i class="fa-solid fa-chart-line text-3xl text-orange-500"></i>
      </div>
    </div>

  </div>

  <!-- GALLERY HEADER -->
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-semibold text-gray-800">Image Gallery</h2>
    <span class="text-sm text-gray-500">Recent uploads</span>
  </div>

  <!-- IMAGE GALLERY -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
    <img src="https://picsum.photos/300/200?1" class="rounded-xl shadow hover:scale-105 transition">
    <img src="https://picsum.photos/300/200?2" class="rounded-xl shadow hover:scale-105 transition">
    <img src="https://picsum.photos/300/200?3" class="rounded-xl shadow hover:scale-105 transition">
    <img src="https://picsum.photos/300/200?4" class="rounded-xl shadow hover:scale-105 transition">
    <img src="https://picsum.photos/300/200?5" class="rounded-xl shadow hover:scale-105 transition">
    <img src="https://picsum.photos/300/200?6" class="rounded-xl shadow hover:scale-105 transition">
    <img src="https://picsum.photos/300/200?7" class="rounded-xl shadow hover:scale-105 transition">
    <img src="https://picsum.photos/300/200?8" class="rounded-xl shadow hover:scale-105 transition">
  </div>

</body>
</html>
