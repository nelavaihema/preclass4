<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Page</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    .register-box {
      width: 350px;
      margin: 80px auto;
      padding: 20px;
      background: white;
      border-radius: 5px;
      box-shadow: 0 0 10px #ccc;
    }

    h2 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 10px;
      background: #28a745;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #1e7e34;
    }
  </style>
</head>

<body>

  <div class="register-box">
    <h2>Register</h2>

    <form>
      <label>Full Name</label>
      <input type="text" placeholder="Enter name" required>

      <label>Email</label>
      <input type="email" placeholder="Enter email" required>

      <label>Password</label>
      <input type="password" placeholder="Enter password" required>

      <label>Confirm Password</label>
      <input type="password" placeholder="Confirm password" required>

      <label>Gender</label>
      <select>
        <option>Select</option>
        <option>Male</option>
        <option>Female</option>
      </select>

      <button type="submit">Register</button>
    </form>
  </div>

</body>
</html>
