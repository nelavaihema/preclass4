<!DOCTYPE html>
<html>
<head>
  <title>Semantic Example</title>
</head>
<body>

  <section>
    <h2>About Company</h2>
    <p>This section contains information about the company.</p>
  </section>

  <article>
    <h2>Blog Post</h2>
    <p>This article can stand alone and be shared independently.</p>
  </article>

  <aside>
    <h3>Related Links</h3>
    <p>Read more blogs and updates here.</p>
  </aside>

</body>
</html>
